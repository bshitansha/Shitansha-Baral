<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <style>
        .container{
            width: 465px;
            height: 285px;
            border: 3px solid olive; 
            position: relative;
        }
        
        div.blue1
        {
            width: 155px; 
            height: 240px; 
            background-color: lightblue;
            border-right: 2px solid olive ; 
            position: absolute; 
            left: 0px; 
            top: 45px;
            padding: 10px; 
            box-sizing: border-box; 
        } 

        div.yellow1 
        {
            width: 155px; 
            height: 75px; 
            background-color: yellow;
            border-bottom: 2px solid olive ; 
            position: absolute ; 
            left: 155px; 
            top: 45px;
            text-align: center; 
            line-height: 75px;
            font-size: 24px; 
            font-weight: bold;
            box-sizing: border-box; 
        } 

        div.red1 
        {
            width: 155px;
            height: 75px; 
            background-color: red ;
            border-bottom: 2px solid olive ;
            position: absolute ; 
            left: 310px; 
            top: 45px;
            text-align: center; 
            line-height: 75px;
            font-size: 24px; 
            color : white ;  
            font-weight: bold;
            box-sizing: border-box; 
        } 

        div.green1 
        {
            width: 310px; 
            height: 165px; 
            background-color: green;
            border-style: 2px solid olive ; 
            position: absolute; 
            left: 155px; 
            top: 120px;  
            padding: 10px 15px; 
            box-sizing: border-box; 
            color: white;  
        }   

        .header-row
         { 
            width: 100%; 
            height: 45px; 
            border: 2px solid olive; 
            position: absolute;
            left: 0px; 
            top: 0px; 
            display: flex; 
        } 

        .col-header 
        { 
            font-weight: bold; 
            text-align: center;
            line-height: 45px;  
        }

        .col1-h {width: 155px; border-right: 2px solid olive; } 
        .col2-h {width: 155px;border-right: 2px solid olive; }
        .col3-h {width: 155px; }  

        ul 
        { 
            margin: 6px 0; 
            padding-left: 20px; 
            font-style: italic; 
            
        } 

        li 
        { 
            font-style: italic; 
        } 

        ol 
        { 
            padding-left: 18px; 
            margin: 6px 0;  
            font-style:italic; 
        } 
        p 
        { 
            margin-bottom: 6px; 
            font-weight: bold; 
        }
        
    </style>
</head>
<body>
    
    <div class="container">
        <div style="position:relative; left:0; top:0; width:450px; height:40px; display: flex; border-bottom: 1px solid olive;">
        <div class="col-header col1-h"  style="border-right:1px solid olive;"> Column 1 </div>

        <div class="col-header col2-h"  style="border-right:1px solid olive;"> Column 2 </div>

        <div class="col-header col3-h"> Column 3 </div> 
    </div> 

    <div class="blue1"> 
        <p><strong> A numbered list:</strong></p>
        <ol>
            <li>Able</li>  
            <li>Baker</li> 
            <li>Delta</li>
            <li>Charlie</li> 
            <li>Echo</li> 
        </ol>
    </div> 

    <div class="yellow1"><strong>B</strong></div> 

    <div class="red1"><strong>C</strong></div> 

    <div class="green1"> 
        <p><strong>An unnumbered list:</strong></p> 
        
        <ul>
            <li>Pounds</li> 
            <li>Dollar</li> 
            <li>Euro</li> 
            <li>Yen</li> 
            <li>Roubles</li> 
        </ul>
    </div> 
</div> 
           
</body>
</html>
